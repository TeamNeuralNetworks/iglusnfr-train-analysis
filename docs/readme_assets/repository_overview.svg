<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Repository overview</title>
  <desc id="desc">Models and decomposition tools for impulse-like electrophysiological and optical signals, applied here to iGluSnFR recordings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfd"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173f52" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#65808e"/>
    </marker>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173f52">
    From impulse-like transients to event-resolved dynamics
  </text>
  <text x="600" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#58717e">
    General tools for electrophysiological and optical signals, applied here to iGluSnFR
  </text>

  <g filter="url(#shadow)">
    <rect x="55" y="115" width="310" height="205" rx="18" fill="#ffffff" stroke="#4d88a5" stroke-width="2"/>
    <rect x="445" y="115" width="310" height="205" rx="18" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="835" y="115" width="310" height="205" rx="18" fill="#ffffff" stroke="#b77934" stroke-width="2"/>
  </g>

  <line x1="373" y1="217" x2="430" y2="217" stroke="#65808e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="763" y1="217" x2="820" y2="217" stroke="#65808e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <circle cx="95" cy="155" r="24" fill="#dcecf4"/>
  <path d="M80 165 C88 165,88 140,97 140 C107 140,106 165,116 165" fill="none" stroke="#245b78" stroke-width="3"/>
  <text x="132" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#245b78">1. Transient models</text>
  <text x="82" y="200" font-family="Arial, sans-serif" font-size="15" fill="#364f5c">Impulse-like response shapes:</text>
  <text x="82" y="224" font-family="Arial, sans-serif" font-size="15" fill="#364f5c">EPSCs, IPSCs, Ca²⁺ and sensors</text>
  <text x="82" y="262" font-family="Arial, sans-serif" font-size="14" fill="#66808d">Parameters · bounds · sensitivity</text>
  <rect x="82" y="280" width="205" height="25" rx="12" fill="#edf5f9"/>
  <text x="184" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#245b78">Model_Calibration/</text>

  <circle cx="485" cy="155" r="24" fill="#dff3ef"/>
  <path d="M472 163 L479 148 L486 160 L494 139 L503 164" fill="none" stroke="#168f83" stroke-width="3"/>
  <text x="522" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#168f83">2. Event extraction</text>
  <text x="472" y="200" font-family="Arial, sans-serif" font-size="15" fill="#364f5c">Non-negative template matching</text>
  <text x="472" y="224" font-family="Arial, sans-serif" font-size="15" fill="#364f5c">separates overlapping responses</text>
  <text x="472" y="262" font-family="Arial, sans-serif" font-size="14" fill="#66808d">Amplitudes · An/A1 · diagnostics</text>
  <rect x="472" y="280" width="205" height="25" rx="12" fill="#e8f6f3"/>
  <text x="574" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#14756d">Feature_extraction/</text>

  <circle cx="875" cy="155" r="24" fill="#fbeddc"/>
  <rect x="864" y="141" width="21" height="28" rx="2" fill="none" stroke="#a86520" stroke-width="2"/>
  <line x1="869" y1="149" x2="880" y2="149" stroke="#a86520" stroke-width="2"/>
  <line x1="869" y1="155" x2="880" y2="155" stroke="#a86520" stroke-width="2"/>
  <line x1="869" y1="161" x2="877" y2="161" stroke="#a86520" stroke-width="2"/>
  <text x="912" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a86520">3. Paper support</text>
  <text x="862" y="200" font-family="Arial, sans-serif" font-size="15" fill="#364f5c">iGluSnFR application, analyses,</text>
  <text x="862" y="224" font-family="Arial, sans-serif" font-size="15" fill="#364f5c">and visual methods for the article</text>
  <text x="862" y="262" font-family="Arial, sans-serif" font-size="14" fill="#66808d">Figures · values · explanations</text>
  <rect x="862" y="280" width="205" height="25" rx="12" fill="#fdf2e5"/>
  <text x="964" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a5d1c">notebooks + docs/</text>

  <text x="600" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#58717e">
    Model the transient  →  separate overlapping events  →  quantify train dynamics
  </text>
</svg>
