<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Prior-tail correction of an overlapping response train</title>
  <desc id="desc">An overlapping fluorescence train is decomposed on the left; corrected short-term plasticity follows simulation truth on the right.</desc>
